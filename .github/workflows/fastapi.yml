name: FastAPI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kostopnews_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d kostopnews_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: kostopnews_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      UPSTAGE_API_KEY: test-key
      SOLAR_MODEL: solar-pro4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run lifespan tests
        run: |
          python -m pytest tests/test_lifespan.py -v

      - name: Run unit tests
        run: |
          python -m pytest -m "not integration" -v

      - name: Start FastAPI
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/fastapi.log 2>&1 &
          echo $! > /tmp/fastapi.pid

      - name: Wait for FastAPI
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/db; then
              echo "FastAPI and DB are ready"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/fastapi.log
          exit 1

      - name: Check API documentation endpoint
        run: |
          curl -fsS http://127.0.0.1:8000/openapi.json \
            -o /tmp/openapi.json

      - name: Stop FastAPI
        if: always()
        run: |
          if [ -f /tmp/fastapi.pid ]; then
            kill "$(cat /tmp/fastapi.pid)" || true
          fi