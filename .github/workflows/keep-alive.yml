name: Keep FastAPI Alive

on:
  push:
    branches:
      - main
  schedule:
    - cron: "2-59/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FastAPI
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            "${{ vars.FASTAPI_URL }}/"